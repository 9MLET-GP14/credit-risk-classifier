[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-risk-classifier"
version = "0.1.0"
description = "Camada de sustentação, contratos de dados, detecção de drift e observabilidade para Credit Scoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "scikit-learn>=1.5,<1.7",
    "pandas>=2.2,<2.3",
    "pyarrow>=18.0",
    "pandera>=0.20",
    "evidently>=0.4.30,<0.5",
    "plotly>=5.24,<6.0",
    "mlflow>=2.17,<3.0",
    "joblib>=1.4,<1.5",
    "pydantic-settings>=2.6,<3.0",
    "psutil>=5.9,<8",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data", "models", "reports", "context"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/credit_risk --cov-report=term-missing"
filterwarnings = [
    "ignore:Could not find the number of physical cores:UserWarning",
    "ignore:Unknown solver options.*iprint",
]

